<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow – Add Task</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="add-task.html">Add Task</a>
    <a href="task-list.html">Task List</a>
    <a href="task-detail.html">Task Detail</a>
    <a href="about.html">About</a>
  </nav>
  <div class="container">
    <h1>Add New Task</h1>
    <label>Task Title:<br><input type="text" placeholder="Enter task title" style="width:100%;padding:8px;margin:8px 0;"></label><br>
    <label>Description:<br><textarea rows="4" placeholder="Task description..." style="width:100%;padding:8px;margin:8px 0;"></textarea></label><br>
    <label>Due Date:<br><input type="date" style="padding:8px;margin:8px 0;"></label><br>
    <label>Priority:
      <select style="padding:8px;margin:8px 0;">
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>
    </label><br><br>
    <button class="btn">Add Task</button>
    <a href="index.html" class="btn">Cancel</a>
  </div>
</body>
</html>
