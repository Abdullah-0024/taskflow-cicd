# .github/workflows/ci.yml
name: CI – Build and Push Docker Image

on:
  pull_request:
    branches:
      - develop        # ← triggers when a PR is OPENED targeting develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 – Checkout Code
        uses: actions/checkout@v4

      - name: Step 2 – Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Step 3 – Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:latest .

      - name: Step 4 – Tag Image with Commit SHA
        run: |
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:${{ github.sha }}

      - name: Step 5 – Push Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-cicd:${{ github.sha }}